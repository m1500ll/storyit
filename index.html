<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storyit — Upload once, post on every TikTok & Instagram account</title>
    <meta name="description" content="Schedule and publish your videos to several TikTok and Instagram accounts from one library, with a caption per account and no accidental duplicates." />
    <meta name="theme-color" content="#0a0a0c" />
    <script>
      // Apply the theme before first paint (no flash). Mirrors src/lib/theme.tsx.
      (function () {
        var t;
        try { t = localStorage.getItem('storyit:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Storyit — Make money with AI story videos" />
    <meta property="og:description" content="Upload once, post on every TikTok and Instagram account." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink-950 text-zinc-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
